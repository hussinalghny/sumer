# سومر: كل الخدمات على بنية يملكها المشغّل.
# التشغيل: cp .env.example .env && (عدّل القيم) && docker compose up -d --build
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: sumer
      POSTGRES_USER: sumer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ضع POSTGRES_PASSWORD في .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    command: ["postgres", "-c", "log_statement=none", "-c", "shared_buffers=1GB", "-c", "work_mem=32MB"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U sumer"], interval: 10s, retries: 10 }

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]

  migrate:
    build: ./backend
    env_file: .env
    environment: &backend_env
      SUMER_DATABASE_URL: postgresql://sumer:${POSTGRES_PASSWORD}@postgres:5432/sumer
      SUMER_REDIS_URL: redis://redis:6379/0
      SUMER_ENV: production
      SUMER_TRUSTED_PROXY: "1"
    command: ["sh", "-c", "psql \"$$SUMER_DATABASE_URL\" -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm' && python -m sumer migrate"]
    depends_on: { postgres: { condition: service_healthy } }

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment: *backend_env
    volumes: [data:/data, ./models:/models:ro]
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_started } }

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment: *backend_env
    command: ["python", "-m", "sumer", "worker"]
    volumes: [data:/data]
    deploy: { replicas: 2 }
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_started } }

  web:
    build: ./frontend
    restart: unless-stopped
    environment: { SUMER_API_INTERNAL: "http://api:8000" }
    depends_on: [api]

  nginx:
    image: nginx:1.27
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes: [./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro, ./deploy/certs:/etc/nginx/certs:ro]
    depends_on: [web, api]

volumes: { pgdata: {}, data: {} }
