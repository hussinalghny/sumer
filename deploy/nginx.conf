# nginx أمام سومر: TLS 1.3 فقط، بلا سجلات وصول، و/api للخلفية والباقي للواجهة.
server {
    listen 80;
    server_name _;
    access_log off;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_session_tickets off;

    access_log off;                       # لا سجلات وصول أبداً
    error_log /var/log/nginx/error.log crit;
    server_tokens off;
    client_max_body_size 9m;              # رفع الصور والصوت

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;   # لتحديد المعدل فقط؛ يُمزج بملح متغير ولا يُحفظ
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
    }
}
