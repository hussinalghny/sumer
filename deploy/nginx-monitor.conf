# GHANI Monitor على النطاق الفرعي ghani.*
server {
    listen 443 ssl;
    http2 on;
    server_name ~^ghani\.;

    ssl_certificate     /etc/nginx/certs-monitor/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs-monitor/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_session_tickets off;

    access_log off;
    error_log /var/log/nginx/error.log crit;
    server_tokens off;
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # يُنصح بشدة: احصر اللوحة بعناوينك فقط (أزل علامة # وضع IP بيتك ومكتبك)
    # allow 203.0.113.10;
    # deny all;

    location / {
        proxy_pass http://monitor:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;          # «افحص الآن» والفحص العميق قد يطولان
    }
}
